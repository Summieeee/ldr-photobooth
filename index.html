<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDR Together Booth 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ff6b9d44, transparent 30%),
        radial-gradient(circle at 80% 80%, #9b59ff44, transparent 30%),
        #160d18;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: min(1050px, 94%);
    text-align: center;
    padding: 30px 15px;
}

h1 {
    font-size: clamp(35px, 7vw, 65px);
    margin: 0;
    letter-spacing: -2px;
}

.subtitle {
    opacity: .75;
    margin: 8px 0 30px;
}

.card {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 20px 70px #0008;
}

input {
    width: min(400px, 100%);
    padding: 15px 18px;
    border-radius: 15px;
    border: none;
    outline: none;
    margin: 7px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 15px;
    padding: 14px 22px;
    margin: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #ff477e;
    color: white;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

.secondary {
    background: rgba(255,255,255,.12);
}

.hidden {
    display: none !important;
}

.room-code {
    font-size: 38px;
    letter-spacing: 8px;
    font-weight: bold;
    margin: 15px;
    color: #ff91b3;
}

.status {
    margin: 15px;
    min-height: 25px;
    opacity: .85;
}

.people {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 25px;
}

.person {
    flex: 1;
    min-width: 280px;
    max-width: 470px;
}

.person h3 {
    margin: 10px;
}

.video-box {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    background: #090609;
    aspect-ratio: 4/3;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

.ready {
    color: #7dffae;
    font-weight: bold;
}

#countdown {
    font-size: 100px;
    font-weight: 900;
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0008;
    z-index: 100;
    pointer-events: none;
}

#resultCanvas {
    width: min(850px, 100%);
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 20px 70px #0009;
}

.scene-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.scene-buttons button {
    background: rgba(255,255,255,.12);
}

.scene-buttons button.active {
    background: #ff477e;
}

.small {
    opacity: .6;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Us, Together 💗</h1>
    <div class="subtitle">
        A photobooth for two people who aren't in the same place.
    </div>

    <!-- HOME -->
    <div id="home" class="card">

        <input id="nameInput" placeholder="Your name">

        <br>

        <button onclick="createRoom()">
            ✨ Create Room
        </button>

        <button class="secondary" onclick="showJoin()">
            💌 Join Room
        </button>

        <div id="joinArea" class="hidden">
            <input id="roomInput" placeholder="6-letter room code">
            <br>
            <button onclick="joinRoom()">
                Join 💗
            </button>
        </div>

        <div id="homeStatus" class="status"></div>
    </div>


    <!-- ROOM -->
    <div id="room" class="card hidden">

        <div class="small">ROOM CODE</div>

        <div id="roomCode" class="room-code">
            ------
        </div>

        <div class="small">
            Send this code to your person 💌
        </div>

        <div id="status" class="status">
            Waiting...
        </div>

        <div class="people">

            <div class="person">
                <h3 id="myName">You</h3>

                <div class="video-box">
                    <video id="myVideo" autoplay muted playsinline></video>
                </div>

                <div id="myReadyText">
                    Not ready
                </div>

                <button onclick="toggleReady()">
                    READY 💗
                </button>
            </div>


            <div class="person">
                <h3 id="partnerName">
                    Waiting for partner...
                </h3>

                <div class="video-box">
                    <video id="partnerVideo" autoplay muted playsinline></video>
                </div>

                <div id="partnerReadyText">
                    Waiting...
                </div>
            </div>

        </div>

        <br>

        <button class="secondary" onclick="takeAnother()">
            🔄 Reset
        </button>

    </div>


    <!-- RESULT -->
    <div id="result" class="card hidden">

        <h2>You two, together 🥹💗</h2>

        <p>
            Choose your shared background:
        </p>

        <div class="scene-buttons">

            <button class="active" onclick="changeScene('pink', this)">
                💗 Pink
            </button>

            <button onclick="changeScene('galaxy', this)">
                🌌 Galaxy
            </button>

            <button onclick="changeScene('sunset', this)">
                🌅 Sunset
            </button>

            <button onclick="changeScene('room', this)">
                🛋️ Cozy
            </button>

        </div>

        <canvas id="resultCanvas"></canvas>

        <br>

        <button onclick="downloadPhoto()">
            📥 Download Photo
        </button>

        <button class="secondary" onclick="takeAnother()">
            📸 Take Another
        </button>

    </div>

</div>


<div id="countdown" class="hidden">
    3
</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    onDisconnect
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyCsNfPivbsyheih1gc5AMyCnOJBtRj1WSE",

    authDomain:
        "summmiieee-cd22d.firebaseapp.com",

    databaseURL:
        "https://summmiieee-cd22d-default-rtdb.firebaseio.com",

    projectId:
        "summmiieee-cd22d",

    storageBucket:
        "summmiieee-cd22d.firebasestorage.app",

    messagingSenderId:
        "285535265907",

    appId:
        "1:285535265907:web:e84304cbcca84dd7a6f606",

    measurementId:
        "G-RJ94E7WDEQ"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================================================
   VARIABLES
========================================================= */

let user = null;

let roomCode = null;

let myName = "";

let myPhoto = null;

let partnerPhoto = null;

let ready = false;

let currentScene = "pink";


/* =========================================================
   AUTH
========================================================= */

async function startFirebase() {

    try {

        const result =
            await signInAnonymously(auth);

        user = result.user;

        document.querySelector("#homeStatus").textContent =
            "Connected to Firebase 💗";

    } catch (error) {

        console.error(error);

        document.querySelector("#homeStatus").textContent =
            "Firebase connection failed: " +
            error.message;
    }
}

startFirebase();


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",
                    width: 1280,
                    height: 720
                },

                audio: false

            });

        document.querySelector("#myVideo").srcObject =
            stream;

    } catch (error) {

        alert(
            "Camera permission is needed for the photobooth 📸"
        );

        console.error(error);
    }
}


/* =========================================================
   HOME
========================================================= */

window.showJoin = function() {

    document.querySelector("#joinArea")
        .classList.remove("hidden");

};


/* =========================================================
   CREATE ROOM
========================================================= */

function generateCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {

        code +=
            chars[Math.floor(Math.random() * chars.length)];

    }

    return code;
}


window.createRoom = async function() {

    if (!user) {

        alert("Still connecting to Firebase. Wait a moment!");

        return;
    }

    myName =
        document.querySelector("#nameInput").value.trim()
        || "Person 1";

    roomCode =
        generateCode();

    await set(
        ref(db, "rooms/" + roomCode),
        {
            createdAt: Date.now(),

            participants: {

                [user.uid]: {

                    name: myName,

                    ready: false,

                    online: true,

                    photo: null

                }

            }

        }
    );

    enterRoom();

};


/* =========================================================
   JOIN ROOM
========================================================= */

window.joinRoom = async function() {

    if (!user) {

        alert("Still connecting to Firebase!");

        return;
    }

    myName =
        document.querySelector("#nameInput").value.trim()
        || "Person 2";

    roomCode =
        document.querySelector("#roomInput")
        .value.trim()
        .toUpperCase();

    if (!roomCode) {

        alert("Enter the room code 💗");

        return;
    }

    const roomRef =
        ref(db, "rooms/" + roomCode);

    const snapshot =
        await get(roomRef);

    if (!snapshot.exists()) {

        alert("That room doesn't exist 😭");

        return;
    }

    await update(

        ref(
            db,
            "rooms/" +
            roomCode +
            "/participants/" +
            user.uid
        ),

        {
            name: myName,

            ready: false,

            online: true,

            photo: null
        }

    );

    enterRoom();

};


/* =========================================================
   ENTER ROOM
========================================================= */

function enterRoom() {

    document.querySelector("#home")
        .classList.add("hidden");

    document.querySelector("#room")
        .classList.remove("hidden");

    document.querySelector("#roomCode")
        .textContent = roomCode;

    document.querySelector("#myName")
        .textContent = myName;

    startCamera();

    listenToRoom();

    onDisconnect(

        ref(
            db,
            "rooms/" +
            roomCode +
            "/participants/" +
            user.uid
        )

    ).update({
        online: false
    });

}


/* =========================================================
   ROOM LISTENER
========================================================= */

function listenToRoom() {

    onValue(

        ref(db, "rooms/" + roomCode),

        snapshot => {

            const data = snapshot.val();

            if (!data) return;

            const participants =
                data.participants || {};

            const ids =
                Object.keys(participants);

            const partnerId =
                ids.find(id => id !== user.uid);


            /* Partner */

            if (partnerId) {

                const partner =
                    participants[partnerId];

                document.querySelector("#partnerName")
                    .textContent =
                    partner.name || "Your person";

                document.querySelector("#partnerReadyText")
                    .innerHTML =
                    partner.ready
                        ? '<span class="ready">READY 💗</span>'
                        : "Not ready";

                if (partner.photo) {

                    partnerPhoto =
                        partner.photo;

                }

            } else {

                document.querySelector("#partnerName")
                    .textContent =
                    "Waiting for partner...";

                document.querySelector("#partnerReadyText")
                    .textContent =
                    "Waiting...";
            }


            /* Me */

            const me =
                participants[user.uid];

            if (me) {

                ready =
                    me.ready;

                document.querySelector("#myReadyText")
                    .innerHTML =
                    ready
                        ? '<span class="ready">READY 💗</span>'
                        : "Not ready";
            }


            /* Both ready */

            if (
                ids.length >= 2 &&
                ids.every(
                    id =>
                    participants[id].ready === true
                ) &&
                !data.captureAt
            ) {

                startCountdown();

            }


            /* Capture timestamp */

            if (data.captureAt) {

                const wait =
                    data.captureAt - Date.now();

                if (wait > 0) {

                    setTimeout(
                        capturePhoto,
                        wait
                    );

                } else {

                    capturePhoto();

                }

            }


            /* Both photos */

            if (
                participants[user.uid]?.photo &&
                partnerId &&
                participants[partnerId]?.photo
            ) {

                myPhoto =
                    participants[user.uid].photo;

                partnerPhoto =
                    participants[partnerId].photo;

                showResult();

            }

        }

    );

}


/* =========================================================
   READY
========================================================= */

window.toggleReady = async function() {

    if (!roomCode || !user) return;

    await update(

        ref(
            db,
            "rooms/" +
            roomCode +
            "/participants/" +
            user.uid
        ),

        {
            ready: !ready
        }

    );

};


/* =========================================================
   COUNTDOWN
========================================================= */

let countdownStarted = false;

function startCountdown() {

    if (countdownStarted) return;

    countdownStarted = true;

    const captureAt =
        Date.now() + 4000;

    update(

        ref(
            db,
            "rooms/" + roomCode
        ),

        {
            captureAt
        }

    );

}


/* =========================================================
   CAPTURE
========================================================= */

let alreadyCaptured = false;

function capturePhoto() {

    if (alreadyCaptured) return;

    alreadyCaptured = true;

    const video =
        document.querySelector("#myVideo");

    const canvas =
        document.createElement("canvas");

    canvas.width =
        video.videoWidth || 1280;

    canvas.height =
        video.videoHeight || 720;

    const ctx =
        canvas.getContext("2d");

    /*
       Mirror the webcam so the photo
       feels like a selfie.
    */

    ctx.translate(
        canvas.width,
        0
    );

    ctx.scale(-1, 1);

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    myPhoto =
        canvas.toDataURL(
            "image/jpeg",
            0.82
        );


    update(

        ref(
            db,
            "rooms/" +
            roomCode +
            "/participants/" +
            user.uid
        ),

        {
            photo: myPhoto
        }

    );

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult() {

    document.querySelector("#room")
        .classList.add("hidden");

    document.querySelector("#result")
        .classList.remove("hidden");

    countdownStarted = false;

    drawTogetherPhoto();

}


/* =========================================================
   SHARED BACKGROUND
========================================================= */

function background(ctx, width, height) {

    let gradient;

    if (currentScene === "galaxy") {

        gradient =
            ctx.createRadialGradient(
                width * .5,
                height * .4,
                20,
                width * .5,
                height * .5,
                width
            );

        gradient.addColorStop(
            0,
            "#5b2c83"
        );

        gradient.addColorStop(
            1,
            "#09051a"
        );

    }

    else if (currentScene === "sunset") {

        gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                height
            );

        gradient.addColorStop(
            0,
            "#ff9a9e"
        );

        gradient.addColorStop(
            1,
            "#fad0c4"
        );

    }

    else if (currentScene === "room") {

        gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                height
            );

        gradient.addColorStop(
            0,
            "#7d4e75"
        );

        gradient.addColorStop(
            1,
            "#2c1830"
        );

    }

    else {

        gradient =
            ctx.createLinearGradient(
                0,
                0,
                width,
                height
            );

        gradient.addColorStop(
            0,
            "#ff758c"
        );

        gradient.addColorStop(
            1,
            "#ff7eb3"
        );

    }

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Decorative hearts */

    ctx.font = "35px Arial";

    ctx.globalAlpha = .35;

    const hearts = [
        [60,70],
        [width-80,100],
        [width-130,height-70],
        [90,height-100],
        [width/2,60]
    ];

    hearts.forEach(
        ([x,y]) =>
            ctx.fillText(
                "♥",
                x,
                y
            )
    );

    ctx.globalAlpha = 1;

}


/* =========================================================
   COMBINE PHOTOS
========================================================= */

function drawTogetherPhoto() {

    if (!myPhoto || !partnerPhoto) return;

    const canvas =
        document.querySelector("#resultCanvas");

    const ctx =
        canvas.getContext("2d");

    const img1 =
        new Image();

    const img2 =
        new Image();

    img1.onload = () => {

        img2.onload = () => {

            const width = 1000;

            const height = 750;

            canvas.width = width;

            canvas.height = height;


            /*
              Shared background.
            */

            background(
                ctx,
                width,
                height
            );


            /*
              This is the simple browser-safe
              "together" composition.

              The two photos are cropped and
              placed into the same scene.
            */

            const personWidth = 440;

            const personHeight = 620;


            ctx.save();

            ctx.beginPath();

            ctx.roundRect(
                55,
                90,
                personWidth,
                personHeight,
                35
            );

            ctx.clip();

            drawCover(
                ctx,
                img1,
                55,
                90,
                personWidth,
                personHeight
            );

            ctx.restore();


            ctx.save();

            ctx.beginPath();

            ctx.roundRect(
                505,
                90,
                personWidth,
                personHeight,
                35
            );

            ctx.clip();

            drawCover(
                ctx,
                img2,
                505,
                90,
                personWidth,
                personHeight
            );

            ctx.restore();


            /*
              Couple-style center decoration.
            */

            ctx.font =
                "bold 55px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                "♥",
                width / 2,
                height - 55
            );


            ctx.font =
                "bold 28px Arial";

            ctx.fillText(
                "US • TOGETHER",
                width / 2,
                50
            );

        };

        img2.src =
            partnerPhoto;

    };

    img1.src =
        myPhoto;

}


/* =========================================================
   COVER IMAGE
========================================================= */

function drawCover(
    ctx,
    image,
    x,
    y,
    width,
    height
) {

    const imageRatio =
        image.width / image.height;

    const boxRatio =
        width / height;

    let sourceWidth =
        image.width;

    let sourceHeight =
        image.height;

    let sourceX = 0;

    let sourceY = 0;

    if (imageRatio > boxRatio) {

        sourceWidth =
            image.height * boxRatio;

        sourceX =
            (image.width - sourceWidth) / 2;

    } else {

        sourceHeight =
            image.width / boxRatio;

        sourceY =
            (image.height - sourceHeight) / 2;

    }

    ctx.drawImage(
        image,
        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,
        x,
        y,
        width,
        height
    );

}


/* =========================================================
   SCENE
========================================================= */

window.changeScene = function(
    scene,
    button
) {

    currentScene =
        scene;

    document
        .querySelectorAll(".scene-buttons button")
        .forEach(
            b =>
            b.classList.remove("active")
        );

    button.classList.add("active");

    drawTogetherPhoto();

};


/* =========================================================
   DOWNLOAD
========================================================= */

window.downloadPhoto = function() {

    const canvas =
        document.querySelector("#resultCanvas");

    const link =
        document.createElement("a");

    link.download =
        "us-together-photobooth.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

};


/* =========================================================
   RESET
========================================================= */

window.takeAnother = async function() {

    alreadyCaptured = false;

    countdownStarted = false;

    myPhoto = null;

    partnerPhoto = null;

    ready = false;

    document.querySelector("#result")
        .classList.add("hidden");

    document.querySelector("#room")
        .classList.remove("hidden");


    if (roomCode && user) {

        await update(

            ref(
                db,
                "rooms/" +
                roomCode +
                "/participants/" +
                user.uid
            ),

            {
                ready: false,
                photo: null
            }

        );

        await update(

            ref(
                db,
                "rooms/" + roomCode
            ),

            {
                captureAt: null
            }

        );

    }

};

</script>

</body>
</html>
